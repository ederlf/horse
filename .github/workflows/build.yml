name: Build and code quality
on: [push, pull_request]
jobs:
  native:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: bindings
        with:
          python-version: ${{ matrix.python }}
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config libevent-dev libpcap-dev
      - name: Native build, tests and install
        run: |
          cmake --preset release
          cmake --build --preset release --parallel 2
          ctest --preset release
          cmake --install build/release --prefix "$PWD/build/install"
          build/install/bin/horse -h
      - name: Python bindings and topology checks
        env:
          FETCHCONTENT_SOURCE_DIR_CFLUID: ${{ github.workspace }}/build/release/_deps/cfluid-src
        run: |
          python -m pip install -e .
          python tests/bindings_smoke.py
          python -m compileall -q horse experiments
      - uses: actions/setup-python@v5
        id: controller
        with:
          python-version: '3.12'
      - name: Real controller smoke tests
        run: |
          python -m venv /tmp/horse-controller
          /tmp/horse-controller/bin/python -m pip install -r requirements-controller.txt
          '${{ steps.bindings.outputs.python-path }}' tests/integration_smoke.py --controller-python /tmp/horse-controller/bin/python
      - name: Source distribution and wheel
        env:
          FETCHCONTENT_SOURCE_DIR_CFLUID: ${{ github.workspace }}/build/release/_deps/cfluid-src
        run: |
          '${{ steps.bindings.outputs.python-path }}' -m pip install build
          '${{ steps.bindings.outputs.python-path }}' -m build
          mkdir -p /tmp/horse-wheel
          tar -xzf dist/horse_project-0.1.0.tar.gz -C /tmp/horse-wheel
          cd /tmp/horse-wheel/horse_project-0.1.0
          '${{ steps.bindings.outputs.python-path }}' -m pip wheel . --no-deps -w /tmp/horse-wheel
          '${{ steps.bindings.outputs.python-path }}' -m pip install --no-deps /tmp/horse-wheel/horse_project-0.1.0-*.whl
          cd /tmp
          env -u PYTHONPATH -u LD_LIBRARY_PATH '${{ steps.bindings.outputs.python-path }}' -c 'import horse; print(horse.__file__)'

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config libevent-dev libpcap-dev
      - name: Install quality tools
        run: python -m pip install -r requirements-dev.txt
      - name: Configure analysis build
        run: cmake --preset release
      - name: Lint, format and static analysis
        run: python tools/check.py --build-dir build/release

  minimum-cmake:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CMake 3.20
        run: python -m pip install cmake==3.20.5
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config libevent-dev libpcap-dev
      - name: Build and test with the minimum CMake version
        run: |
          cmake --version
          cmake --preset dev
          cmake --build --preset dev --parallel 2
          ctest --preset dev

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libevent-dev libpcap-dev
      - name: Configure, build and test with sanitizers
        run: |
          cmake --preset sanitize -DCMAKE_C_COMPILER=clang
          cmake --build --preset sanitize --parallel 2
          ctest --preset sanitize
